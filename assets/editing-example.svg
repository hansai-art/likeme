<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300">
  <rect width="1440" height="1300" fill="#f5f2ea"/>
  <g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">
    <text x="76" y="76" font-size="22" letter-spacing="2" fill="#b34b35">像我本人 / 編輯判斷</text>
    <text x="76" y="154" font-size="52" font-weight="700" fill="#222824">把「去 AI 味」當成「每句都要改」</text>
    <text x="76" y="208" font-size="25" fill="#686d66">你不滿意的核心：Skill 沒先判斷原文是否自然，就先用摘要模板換詞。</text>
    <path d="M76 244H1364" stroke="#d9d2c5" stroke-width="2"/>

    <rect x="76" y="284" width="612" height="492" rx="22" fill="#fffefa" stroke="#d9e4da" stroke-width="2"/>
    <rect x="104" y="311" width="330" height="42" rx="21" fill="#e5f0e6"/>
    <text x="126" y="340" font-size="22" font-weight="700" fill="#28714d">原文｜清楚、自然、有畫面</text>
    <text x="112" y="415" font-size="31" fill="#222824">想傳狗，就傳狗。</text>
    <text x="112" y="467" font-size="31" fill="#222824">想傳旅遊，就傳旅遊。</text>
    <text x="112" y="519" font-size="29" fill="#222824">今天吃了什麼奇怪的東西，也可以拍。</text>
    <text x="112" y="571" font-size="31" fill="#222824">總之，只要是影片都行。</text>
    <path d="M112 619H650" stroke="#e6e2d8" stroke-width="2"/>
    <text x="112" y="674" font-size="26" font-weight="700" fill="#28714d">這段已經說得清楚，不需要改寫。</text>

    <rect x="752" y="284" width="612" height="492" rx="22" fill="#fffaf7" stroke="#e8c6bb" stroke-width="2"/>
    <rect x="780" y="311" width="274" height="42" rx="21" fill="#f8e4dc"/>
    <text x="802" y="340" font-size="22" font-weight="700" fill="#a13d2b">Skill 過度改寫｜摘要模板</text>
    <text x="790" y="414" font-size="29" fill="#222824">開放後，寵物、旅遊或日常</text>
    <text x="790" y="458" font-size="29" fill="#222824">生活的影片都能上傳，不必</text>
    <text x="790" y="502" font-size="29" fill="#222824">用來找約會對象。</text>
    <path d="M790 535H1326" stroke="#ecdcd5" stroke-width="2"/>
    <text x="790" y="582" font-size="23" font-weight="700" fill="#a13d2b">狗 → 寵物</text>
    <text x="925" y="582" font-size="20" fill="#686d66">具體用字變成大分類</text>
    <text x="790" y="630" font-size="22" font-weight="700" fill="#a13d2b">奇怪食物 → 日常生活</text>
    <text x="1082" y="630" font-size="20" fill="#686d66">有畫面的例子被抽掉</text>
    <text x="790" y="700" font-size="22" fill="#a13d2b">句子變短了，作者的說法也不見了。</text>

    <path d="M697 519H742" stroke="#bd533d" stroke-width="4"/>
    <path d="M730 507L742 519L730 531" fill="none" stroke="#bd533d" stroke-width="4"/>
    <text x="692" y="491" font-size="17" fill="#a13d2b">硬改</text>

    <rect x="76" y="814" width="1288" height="106" rx="18" fill="#272f2b"/>
    <text x="112" y="858" font-size="22" fill="#edb8a8">真正的問題</text>
    <text x="112" y="895" font-size="30" font-weight="700" fill="#fffefa">Skill 把口語當成錯誤，還把案例來源當成標題。</text>
    <text x="112" y="953" font-size="22" fill="#686d66">標題只列案例來源，沒說明這段要教什麼。</text>

    <text x="76" y="1020" font-size="25" font-weight="700" fill="#222824">改稿先走這一步：原文到底有沒有問題？</text>
    <rect x="76" y="1044" width="612" height="142" rx="18" fill="#e7f0e8"/>
    <circle cx="121" cy="1115" r="20" fill="#28714d"/>
    <path d="M111 1115L118 1122L132 1107" fill="none" stroke="#fffefa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="1097" font-size="23" fill="#28714d">原文自然、清楚</text>
    <text x="160" y="1147" font-size="34" font-weight="700" fill="#222824">保留原句</text>
    <rect x="752" y="1044" width="612" height="142" rx="18" fill="#f7e7df"/>
    <circle cx="797" cy="1115" r="20" fill="#b34b35"/>
    <path d="M787 1115L794 1122L808 1107" fill="none" stroke="#fffefa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="836" y="1097" font-size="23" fill="#a13d2b">原文有明確問題</text>
    <text x="836" y="1147" font-size="34" font-weight="700" fill="#222824">只修那一處</text>
    <text x="76" y="1240" font-size="21" fill="#686d66">編輯不是改得越多越好：保留作者的詞、例子和節奏，才是真的照人的方式寫。</text>
  </g>
</svg>